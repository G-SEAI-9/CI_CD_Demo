name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

jobs:
  test-and-build: # unser Name
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*', 'lts/-1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build
