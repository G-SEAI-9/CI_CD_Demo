name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

jobs:
  test-and-build: # unser Name
    runs-on: ubuntu-latest

    steps:
      - uses: action/checkout@v6

      - uses: action/setup-node@v6
        with:
          node-version: 26 # latest

      - run: npm ci
      - run: npm run test
      - run: npm run build
